<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#065f46">
    <title>Sin conexión</title>
    <style>
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: system-ui, sans-serif; background: #f8fafc; color: #0f172a; text-align: center; padding: 24px; }
        main { max-width: 320px; }
        h1 { font-size: 1.5rem; margin: 0 0 8px; }
        p { color: #475569; margin: 0 0 24px; }
        button { height: 48px; padding: 0 24px; border: 0; border-radius: 12px; background: #065f46; color: #fff; font-size: 1rem; font-weight: 600; }
    </style>
</head>
<body>
    <main>
        <h1>Sin conexión</h1>
        <p>No pudimos conectar con la tienda. Revisa tu internet e inténtalo de nuevo. Lo que ya habías agregado a tu compra se conserva.</p>
        <button type="button" onclick="location.reload()">Reintentar</button>
    </main>
</body>
</html>
